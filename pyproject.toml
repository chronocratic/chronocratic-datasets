[build-system]
requires = ["setuptools>=68", "wheel"]

[project]
name = "chronocratic-datasets"
version = "0.1.0"
description = "Ready-to-use time series datasets for PyTorch Lightning"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["time-series", "pytorch", "lightning", "machine-learning", "datasets"]
authors = [{name = "The Chronocratic Developers", email = "github@users.noreply.github.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.1,<3.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.6,<2.0.0",
    "lightning>=2.5,<3.0",
    "torch>=2.4,<3.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=3.0",
]

[project.urls]
Homepage = "https://github.com/chronocratic/datasets"
Documentation = "https://chronocratic-datasets.readthedocs.io/en/stable/"
Repository = "https://github.com/chronocratic/datasets"
Issues = "https://github.com/chronocratic/datasets/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

notebooks = [
    "notebook>=7.3",
    "jupyterlab>=4.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
