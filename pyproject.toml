# ==============================================================================
# SCENARIO 1: You are on a Mac (Apple Silicon / MPS)
# -> Run: `uv sync`
# (By default, uv ignores the custom links and pulls standard Mac wheels from PyPI).
#
# SCENARIO 2: You are on an HPC Cluster (e.g., RWTH Aachen nodes) with GPUs
# -> Run: `uv sync --extra cu118`  (If the node is running CUDA 11.8)
# -> Run: `uv sync --extra cu124`  (If the node is running CUDA 12.4)
#
# SCENARIO 3: You are running CI Tests or a remote CPU-only server
# -> Run: `uv sync --extra cpu`
# (This bypasses the 3GB NVIDIA driver downloads and installs a lightweight CPU build).
#
# IMPORTANT: Executing Code
# When running scripts on a machine where you used an extra during installation,
# you MUST pass that extra to the run command so uv knows which environment context to use:
# -> Example: `uv run --extra cu118 python src/runners.py/runner.py`
# ==============================================================================