[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "tsdatasets"
version = "0.1.0"
description = "Reusable time-series datasets and data modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.11.0", "ty>=0.0.34"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty]

[tool.hatch.build.targets.wheel]
packages = ["src/tsdatasets"]
