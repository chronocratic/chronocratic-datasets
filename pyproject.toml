[build-system]
requires = ["setuptools>=68", "wheel"]

[project]
name = "tsdatasets"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "lightning~=2.5.5",
    "torch>=2.4.0,<=2.8.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
    "openpyxl~=3.1.5",
    "h5py~=3.16.0"
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

notebooks = [
    "notebook>=7.3",
    "jupyterlab>=4.3",
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["test"]
