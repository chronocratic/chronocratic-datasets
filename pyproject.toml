[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbspaper"
version = "0.1.0"
description = "Robust Time Series Representation Learning benchmark scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1,<3.0.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "tenacity>=9.1.4",
    "torch>=2.4.0,<=2.8.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "lightning==2.5.5",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
    "pywavelets>=1.8.0",
    "numba>=0.60.0",
    "einops>=0.8.2",
]

[project.scripts]
rbspaper-run = "runners.py.runner:main"

# --- THE HARDWARE SWITCHES ---
[project.optional-dependencies]
cpu = []
cu118 = []
cu121 = []
cu124 = []

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

attacks = [
    "adversarial-robustness-toolbox~=1.20",
    "torchattacks~=3.5",
    "foolbox~=3.3",
]

attacks_extended = [
    "cleverhans~=4.0",
]

tracking = [
    "wandb>=0.24.2",
    "tensorboard>=2.18.0",
]

notebooks = [
    "notebook>=7.3",
    "jupyterlab>=4.3",
]

[tool.uv]
default-groups = ["dev", "attacks", "tracking"]
conflicts = [
    [
        { group = "attacks" },
        { group = "notebooks" },
    ],
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src", "experiment_instances"]
testpaths = ["test"]

